<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restaurant QR Code</title>
  <style>
    :root {
      --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5b6470;
      --accent:#2563eb; --border:#dde1e6; --warn-bg:#fff7e6; --warn:#8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa3ad;
        --accent:#3b82f6; --border:#2a2f37; --warn-bg:#2b2310; --warn:#f0c36a; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg);
      color:var(--text); display:flex; justify-content:center; padding:24px 16px; }
    main { width:100%; max-width:520px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; }
    .qr-card { text-align:center; }
    .qr-card h1 { font-size:1.6rem; margin:0 0 4px; }
    .qr-card p { color:var(--muted); margin:0 0 16px; }
    .qr-wrap { background:#fff; border-radius:12px; padding:12px; display:inline-block; }
    canvas#qr { display:block; width:min(280px, 70vw); height:auto; image-rendering:pixelated; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
    button, a.btn { flex:1 1 auto; font:inherit; font-weight:600; cursor:pointer; padding:10px 14px;
      border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text);
      text-align:center; text-decoration:none; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .link { font-family:ui-monospace,Menlo,monospace; font-size:.8rem; word-break:break-all;
      color:var(--muted); margin-top:12px; }
    .note { background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:10px 12px;
      font-size:.88rem; margin-top:14px; text-align:left; }
    h2 { font-size:1rem; margin:0 0 12px; }
    label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
    input { width:100%; font:inherit; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
      background:var(--bg); color:var(--text); }
    input[readonly] { color:var(--muted); cursor:default; border-style:dashed; }
    input[readonly]:focus { outline:none; }
    .two { display:flex; gap:8px; } .two > div { flex:1; }
    .hint { font-size:.8rem; color:var(--muted); margin-top:8px; }
    @media print {
      body { background:#fff; padding:0; } .no-print { display:none !important; }
      .card { border:0; } .qr-card p, .qr-card h1 { color:#000; }
      canvas#qr { width:9cm; }
    }
  </style>
</head>
<body>
<main>
  <section class="card qr-card">
    <h1 id="title">Tussi Khao Ji – Punjabi Vegetarian Restaurant</h1>
    <p>Scan with your phone camera for directions</p>
    <div class="qr-wrap"><canvas id="qr" aria-label="QR code with directions to the restaurant"></canvas></div>
    <div class="link no-print" id="link"></div>
    <div class="note no-print" id="note" hidden></div>
    <div class="row no-print">
      <button class="primary" id="downloadBtn">Download PNG</button>
      <button id="printBtn">Print</button>
      <a class="btn" id="testBtn" target="_blank" rel="noopener">Test link</a>
    </div>
  </section>

  <section class="card no-print">
    <h2>Restaurant location</h2>
    <label for="name">Name</label>
    <input id="name" readonly tabindex="-1" />
    <label for="address">Address</label>
    <input id="address" placeholder="Street, city" autocomplete="off" />
    <div class="two">
      <div><label for="lat">Latitude</label><input id="lat" readonly tabindex="-1" /></div>
      <div><label for="lng">Longitude</label><input id="lng" readonly tabindex="-1" /></div>
    </div>
    <div class="hint">Name and location are fixed. To change them, edit <code>config.js</code>.</div>
  </section>

  <div class="row no-print"><a class="btn" href="scan.html">Open in-app scanner</a></div>
</main>

<script src="vendor/qrcode.js"></script>
<script src="config.js"></script>
<script src="maps.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const fields = ['name', 'address', 'lat', 'lng'];
  const canvas = $('qr'), linkEl = $('link'), noteEl = $('note'), titleEl = $('title');

  // Start from ?name=..&address=.. in this page's URL if present, otherwise config.js
  // Name and coordinates always come from config.js (they can't be changed on the page or via the URL)
  const start = window.RESTAURANT || {};
  fields.forEach(f => { $(f).value = start[f] || ''; });

  // A phone can only open the redirect page if this site is reachable from the internet
  const hosted = /^https?:$/.test(location.protocol) &&
    !/^(localhost|127\.|0\.0\.0\.0|\[::1\]|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);

  function currentDest() {
    const d = {}; fields.forEach(f => { d[f] = $(f).value; }); return Maps.normalize(d);
  }

  function qrTarget(dest) {
    if (hosted) {
      const base = new URL('go.html', location.href);
      base.search = Maps.toQuery(dest);
      return base.href;
    }
    // Not online yet: point straight at Google Maps (works on Android and iPhone)
    return Maps.directionsUrl(dest, 'google');
  }

  function draw(text) {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount(), quiet = 4, scale = 10, size = (n + quiet * 2) * scale;
    canvas.width = canvas.height = size;
    const c = canvas.getContext('2d');
    c.fillStyle = '#fff'; c.fillRect(0, 0, size, size);
    c.fillStyle = '#000';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++)
      if (qr.isDark(r, col)) c.fillRect((col + quiet) * scale, (r + quiet) * scale, scale, scale);
  }

  function update() {
    const dest = currentDest();
    titleEl.textContent = (dest && dest.name) || 'Restaurant';
    document.title = (dest && dest.name ? dest.name + ' – ' : '') + 'QR Code';
    if (!dest) {
      canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
      linkEl.textContent = 'Enter a name, address or coordinates.';
      return;
    }
    const target = qrTarget(dest);
    draw(target);
    linkEl.textContent = target;
    $('testBtn').href = target;
    canvas.dataset.target = target;

    const notes = [];
    if (!hosted) notes.push('This page is running on your computer, so the QR code links straight to Google Maps. Once the site is online (for example on GitHub Pages), the QR code will open Apple Maps on iPhones and Google Maps on Android.');
    if (!dest.lat && !dest.address) notes.push('Only a name is set, so the maps app will search for it. Add an address or coordinates so people are taken to the right place.');
    noteEl.hidden = !notes.length;
    noteEl.innerHTML = notes.map(n => `<div>${n}</div>`).join('<br>');

  }

  fields.forEach(f => $(f).addEventListener('input', update));
  $('printBtn').addEventListener('click', () => window.print());
  $('downloadBtn').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = (($('name').value || 'restaurant').replace(/[^\w-]+/g, '-')) + '-qr.png';
    a.click();
  });
  update();
})();
</script>
</body>
</html>
