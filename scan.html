<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restaurant Scanner</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5b6470;
      --accent: #2563eb; --accent-text: #ffffff; --border: #dde1e6; --ok: #15803d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa3ad;
        --accent: #3b82f6; --accent-text: #ffffff; --border: #2a2f37; --ok: #4ade80;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; justify-content: center; padding: 24px 16px;
    }
    main { width: 100%; max-width: 520px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: var(--muted); }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; margin-bottom: 16px;
    }
    .viewport {
      position: relative; width: 100%; aspect-ratio: 1 / 1; background: #000;
      border-radius: 10px; overflow: hidden; display: grid; place-items: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    .placeholder { color: #9aa3ad; text-align: center; padding: 16px; }
    .frame {
      position: absolute; inset: 15%; border: 3px solid rgba(255,255,255,.85);
      border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,.35);
      pointer-events: none; display: none;
    }
    .scanning .frame { display: block; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button, label.btn {
      flex: 1 1 auto; font: inherit; font-weight: 600; cursor: pointer;
      padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); text-align: center;
    }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    select { font: inherit; padding: 9px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); width: 100%; margin-top: 12px; }
    input[type=file] { display: none; }
    .result-text {
      word-break: break-all; font-family: ui-monospace, Menlo, monospace;
      background: var(--bg); padding: 12px; border-radius: 8px; min-height: 44px;
    }
    .status { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.2em; }
    .status.ok { color: var(--ok); }
    h2 { font-size: 1rem; margin: 0 0 10px; }
    ul.history { list-style: none; padding: 0; margin: 0; }
    ul.history li { padding: 8px 0; border-top: 1px solid var(--border); word-break: break-all; font-size: .9rem; }
    ul.history li:first-child { border-top: 0; }
    a { color: var(--accent); }
    canvas { display: none; }
  </style>
</head>
<body>
<main>
  <h1>Find the Restaurant</h1>
  <p class="sub">Scan a restaurant's QR code and get directions in Google Maps or Apple Maps. <a href="index.html">Show QR code</a></p>

  <section class="card">
    <div class="viewport" id="viewport">
      <video id="video" playsinline muted hidden></video>
      <div class="placeholder" id="placeholder">Camera is off</div>
      <div class="frame"></div>
    </div>
    <select id="cameraSelect" hidden aria-label="Choose camera"></select>
    <div class="row">
      <button class="primary" id="startBtn">Start camera</button>
      <button id="stopBtn" disabled>Stop</button>
      <label class="btn" for="fileInput">Scan image</label>
      <input type="file" id="fileInput" accept="image/*" />
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card">
    <h2>Result</h2>
    <div class="result-text" id="result">—</div>
    <div class="row">
      <button id="copyBtn" disabled>Copy</button>
      <button class="primary" id="openBtn" disabled>Get directions</button>
    </div>
  </section>

  <section class="card">
    <h2>History</h2>
    <ul class="history" id="history"><li>No scans yet</li></ul>
  </section>
  <canvas id="canvas"></canvas>
</main>

<script src="vendor/jsQR.js"></script>
<script src="maps.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const video = $('video'), canvas = $('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
  const viewport = $('viewport'), placeholder = $('placeholder'), statusEl = $('status');
  const startBtn = $('startBtn'), stopBtn = $('stopBtn'), fileInput = $('fileInput');
  const resultEl = $('result'), copyBtn = $('copyBtn'), openBtn = $('openBtn');
  const historyEl = $('history'), cameraSelect = $('cameraSelect');

  let stream = null, rafId = null, lastValue = null, history = [];
  const detector = ('BarcodeDetector' in window) ? safeDetector() : null;

  function safeDetector() {
    try { return new BarcodeDetector({ formats: ['qr_code'] }); } catch { return null; }
  }

  try { history = JSON.parse(localStorage.getItem('qr-history') || '[]'); } catch { history = []; }

  function setStatus(msg, ok = false) {
    statusEl.textContent = msg; statusEl.classList.toggle('ok', ok);
  }

  function isUrl(s) {
    try { const u = new URL(s); return u.protocol === 'http:' || u.protocol === 'https:'; } catch { return false; }
  }

  const MAPS_HOSTS = /^(www\.)?(google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs|g\.page|maps\.apple\.com)/i;
  const COORDS = /^\s*(-?\d{1,2}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)\s*$/;

  // Turn whatever the QR contains into a directions link (Apple Maps on iPhone, Google Maps elsewhere),
  // or null if it isn't a location.
  function toMapsUrl(raw) {
    const text = raw.trim();
    if (!text) return null;

    if (isUrl(text)) {
      const u = new URL(text);
      // 1. One of our own restaurant QR codes (…/go.html?name=..&lat=..)
      if (/\/go\.html$/.test(u.pathname)) return Maps.directionsUrl(Maps.fromQuery(u.search));
      // 2. Already a Google / Apple Maps link: open it as-is
      return MAPS_HOSTS.test(u.host + u.pathname) ? u.href : null;
    }
    // 3. geo:lat,lng?q=Name
    const geo = text.match(/^geo:(-?[\d.]+),(-?[\d.]+)(?:[;,][^?]*)?(?:\?(.*))?$/i);
    if (geo) {
      const q = new URLSearchParams(geo[3] || '').get('q');
      return Maps.directionsUrl({ lat: geo[1], lng: geo[2], name: q && !/^[-\d.,\s]+$/.test(q) ? q : '' });
    }
    // 4. "lat,lng"
    const c = text.match(COORDS);
    if (c) return Maps.directionsUrl({ lat: c[1], lng: c[2] });
    // 5. JSON like {"name": "...", "address": "...", "lat": .., "lng": ..}
    if (text.startsWith('{')) {
      try {
        const o = JSON.parse(text);
        if (o.mapsUrl && isUrl(o.mapsUrl)) return toMapsUrl(o.mapsUrl);
        return Maps.directionsUrl({ name: o.name, address: o.address,
          lat: o.lat ?? o.latitude, lng: o.lng ?? o.lon ?? o.longitude });
      } catch { /* not JSON, treat as text */ }
    }
    // 6. Plain text is treated as a restaurant name / address
    return Maps.directionsUrl({ address: text });
  }

  let pendingNav = null;
  function showResult(text) {
    const mapsUrl = toMapsUrl(text);
    resultEl.textContent = text;
    copyBtn.disabled = false;
    openBtn.disabled = !mapsUrl;
    openBtn.dataset.url = mapsUrl || '';
    if (navigator.vibrate) navigator.vibrate(80);
    if (text !== lastValue) {
      lastValue = text;
      history = [{ text, at: Date.now() }, ...history.filter(h => h.text !== text)].slice(0, 20);
      try { localStorage.setItem('qr-history', JSON.stringify(history)); } catch {}
      renderHistory();
    }
    if (!mapsUrl) {
      setStatus("This QR code isn't a restaurant location.");
      return;
    }
    // Found a location: stop scanning and go to Google Maps
    stopCamera();
    setStatus('Opening directions…', true);
    clearTimeout(pendingNav);
    pendingNav = setTimeout(() => { window.location.href = mapsUrl; }, 600);
  }

  function renderHistory() {
    historyEl.innerHTML = '';
    if (!history.length) { historyEl.innerHTML = '<li>No scans yet</li>'; return; }
    for (const h of history) {
      const li = document.createElement('li');
      const mapsUrl = toMapsUrl(h.text);
      if (mapsUrl) {
        const a = document.createElement('a');
        a.href = mapsUrl; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = h.text;
        li.appendChild(a);
      } else {
        li.textContent = h.text;
      }
      historyEl.appendChild(li);
    }
  }

  async function decode(source, w, h) {
    if (detector) {
      try {
        const codes = await detector.detect(source);
        if (codes.length) return codes[0].rawValue;
      } catch { /* fall through to jsQR */ }
    }
    if (!window.jsQR) return null;
    canvas.width = w; canvas.height = h;
    ctx.drawImage(source, 0, 0, w, h);
    const img = ctx.getImageData(0, 0, w, h);
    const code = jsQR(img.data, w, h, { inversionAttempts: 'attemptBoth' });
    return code ? code.data : null;
  }

  async function tick() {
    if (!stream) return;
    if (video.readyState >= video.HAVE_ENOUGH_DATA) {
      // Downscale large frames for speed
      const scale = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
      const value = await decode(video, Math.round(video.videoWidth * scale), Math.round(video.videoHeight * scale));
      if (value) showResult(value);
    }
    rafId = requestAnimationFrame(tick);
  }

  async function listCameras() {
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    if (devices.length < 2) { cameraSelect.hidden = true; return; }
    const current = stream?.getVideoTracks()[0]?.getSettings().deviceId;
    cameraSelect.innerHTML = '';
    devices.forEach((d, i) => {
      const opt = new Option(d.label || `Camera ${i + 1}`, d.deviceId);
      if (d.deviceId === current) opt.selected = true;
      cameraSelect.add(opt);
    });
    cameraSelect.hidden = false;
  }

  async function startCamera(deviceId) {
    if (!navigator.mediaDevices?.getUserMedia) {
      setStatus('Camera not supported here. Use "Scan image" instead (camera needs HTTPS or localhost).');
      return;
    }
    stopCamera();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: 'environment' } },
        audio: false,
      });
    } catch (e) {
      setStatus(e.name === 'NotAllowedError' ? 'Camera permission denied.' : 'Could not start camera: ' + e.message);
      return;
    }
    video.srcObject = stream;
    video.hidden = false; placeholder.hidden = true;
    viewport.classList.add('scanning');
    await video.play();
    startBtn.disabled = true; stopBtn.disabled = false;
    setStatus('Point the camera at a QR code…');
    listCameras();
    tick();
  }

  function stopCamera() {
    cancelAnimationFrame(rafId);
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.hidden = true; placeholder.hidden = false;
    viewport.classList.remove('scanning');
    startBtn.disabled = false; stopBtn.disabled = true;
  }

  async function scanFile(file) {
    if (!file) return;
    setStatus('Reading image…');
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = async () => {
      const scale = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      const value = await decode(img, Math.round(img.naturalWidth * scale), Math.round(img.naturalHeight * scale));
      URL.revokeObjectURL(url);
      value ? showResult(value) : setStatus('No QR code found in that image.');
    };
    img.onerror = () => { URL.revokeObjectURL(url); setStatus('Could not load that image.'); };
    img.src = url;
  }

  startBtn.addEventListener('click', () => startCamera());
  stopBtn.addEventListener('click', () => { stopCamera(); setStatus('Camera stopped.'); });
  cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));
  fileInput.addEventListener('change', () => { scanFile(fileInput.files[0]); fileInput.value = ''; });
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(resultEl.textContent); setStatus('Copied to clipboard', true); }
    catch { setStatus('Copy failed — select the text manually.'); }
  });
  openBtn.addEventListener('click', () => {
    if (openBtn.dataset.url) window.location.href = openBtn.dataset.url;
  });
  renderHistory();
  document.addEventListener('visibilitychange', () => { if (document.hidden && stream) stopCamera(); });
})();
</script>
</body>
</html>
