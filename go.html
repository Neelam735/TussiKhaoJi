<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Directions</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5b6470; --accent:#2563eb; --border:#dde1e6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa3ad; --accent:#3b82f6; --border:#2a2f37; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg);
      color:var(--text); display:flex; justify-content:center; padding:40px 16px; }
    main { width:100%; max-width:420px; text-align:center; }
    h1 { font-size:1.4rem; margin:0 0 6px; }
    p { color:var(--muted); margin:0 0 24px; }
    a.btn { display:block; padding:14px; margin-bottom:10px; border-radius:12px; font-weight:600;
      text-decoration:none; border:1px solid var(--border); background:var(--card); color:var(--text); }
    a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  </style>
</head>
<body>
<main>
  <h1 id="title">Getting directions…</h1>
  <p id="sub">Opening your maps app.</p>
  <a class="btn primary" id="primary" href="#">Open directions</a>
  <a class="btn" id="secondary" href="#">Use another maps app</a>
</main>
<script src="config.js"></script>
<script src="maps.js"></script>
<script>
  const dest = Maps.fromQuery(location.search) || Maps.normalize(window.RESTAURANT);
  const title = document.getElementById('title'), sub = document.getElementById('sub');
  const primary = document.getElementById('primary'), secondary = document.getElementById('secondary');

  if (!dest) {
    title.textContent = 'No restaurant location';
    sub.textContent = 'This QR code does not contain a destination.';
    primary.hidden = secondary.hidden = true;
  } else {
    const ios = Maps.isIOS();
    const apple = Maps.directionsUrl(dest, 'apple'), google = Maps.directionsUrl(dest, 'google');
    title.textContent = 'Directions to ' + (dest.name || dest.address || 'the restaurant');
    primary.href = ios ? apple : google;
    primary.textContent = ios ? 'Open in Apple Maps' : 'Open in Google Maps';
    secondary.href = ios ? google : apple;
    secondary.textContent = ios ? 'Use Google Maps instead' : 'Use Apple Maps instead';
    if (!ios) secondary.hidden = true; // Apple Maps links only make sense on Apple devices
    // Go straight to the maps app; the buttons stay as a fallback if the redirect is blocked
    location.replace(primary.href);
  }
</script>
</body>
</html>
